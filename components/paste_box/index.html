<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zona de Pegado</title>
  <script src="./streamlit-component-lib.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: transparent;
      padding: 4px;
      overflow: hidden;
    }
    .paste-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .paste-zone {
      border: 2px dashed #EC2024;
      background-color: #FFF5F5;
      border-radius: 8px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .paste-zone:hover, .paste-zone:focus {
      background-color: #FEE2E2;
      border-color: #B91C1C;
      box-shadow: 0 0 0 3px rgba(236, 32, 36, 0.15);
    }
    .btn-paste {
      background-color: #EC2024;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }
    .btn-paste:hover {
      background-color: #B91C1C;
    }
    .text-title {
      color: #111111;
      font-size: 13px;
      font-weight: 700;
    }
    .text-sub {
      color: #64748B;
      font-size: 11.5px;
    }
    .status-msg {
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    .status-success {
      color: #166534;
      font-weight: 600;
    }
    .status-info {
      color: #991B1B;
      font-weight: 600;
    }
    .preview-thumb {
      max-height: 80px;
      border-radius: 4px;
      border: 1px solid #CBD5E1;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="paste-container">
    <div id="pasteZone" class="paste-zone" tabindex="0" title="Haga clic aquí y presione Ctrl+V para pegar">
      <button type="button" id="btnPaste" class="btn-paste">
        📋 Pegar desde el Portapapeles
      </button>
      <div class="text-title">o haga clic aquí y presione <kbd style="background:#E2E8F0; padding:2px 6px; border-radius:4px; font-weight:bold;">Ctrl + V</kbd></div>
      <div class="text-sub">Admite capturas de pantalla, recortes y copias de imagen directas</div>
      <div id="statusMsg" class="status-msg"></div>
      <img id="previewImg" class="preview-thumb" alt="Vista previa de captura" />
    </div>
  </div>

  <script>
    const pasteZone = document.getElementById('pasteZone');
    const btnPaste = document.getElementById('btnPaste');
    const statusMsg = document.getElementById('statusMsg');
    const previewImg = document.getElementById('previewImg');

    function updateHeight() {
      const height = document.body.scrollHeight + 10;
      Streamlit.setFrameHeight(height);
    }

    function showStatus(text, isSuccess) {
      statusMsg.style.display = 'block';
      statusMsg.className = 'status-msg ' + (isSuccess ? 'status-success' : 'status-info');
      statusMsg.textContent = text;
      updateHeight();
    }

    function processImageFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showStatus('⚠️ El contenido del portapapeles no es una imagen válida.', false);
        return;
      }
      showStatus('⏳ Procesando imagen...', true);
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        previewImg.src = dataUrl;
        previewImg.style.display = 'block';
        showStatus('✅ ¡Imagen lista! Aparecerá en la vista previa para guardar.', true);
        updateHeight();
        Streamlit.setComponentValue(dataUrl);
      };
      reader.onerror = function() {
        showStatus('❌ Error al procesar los datos de la imagen.', false);
      };
      reader.readAsDataURL(file);
    }

    // 1. Manejo del evento Paste estándar (Ctrl + V)
    function handlePasteEvent(e) {
      const clipboardData = e.clipboardData || window.clipboardData;
      if (!clipboardData) return;

      const items = clipboardData.items;
      if (items) {
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            const blob = items[i].getAsFile();
            if (blob) {
              e.preventDefault();
              processImageFile(blob);
              return;
            }
          }
        }
      }
      
      const files = clipboardData.files;
      if (files && files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          if (files[i].type.startsWith('image/')) {
            e.preventDefault();
            processImageFile(files[i]);
            return;
          }
        }
      }

      showStatus('⚠️ No se detectó ninguna imagen en el portapapeles. Copie una imagen primero (Ctrl+C o Win+Shift+S) y presione Ctrl+V aquí.', false);
    }

    pasteZone.addEventListener('paste', handlePasteEvent);
    document.addEventListener('paste', handlePasteEvent);

    // 2. Manejo del botón de clic
    btnPaste.addEventListener('click', async function(e) {
      e.stopPropagation();
      pasteZone.focus();

      if (navigator.clipboard && navigator.clipboard.read) {
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const imageType = item.types.find(t => t.startsWith('image/'));
            if (imageType) {
              const blob = await item.getType(imageType);
              processImageFile(blob);
              return;
            }
          }
          showStatus('⚠️ No se detectó ninguna imagen en el portapapeles. Copie una imagen primero.', false);
          return;
        } catch (err) {
          console.warn('Clipboard read error (iframe restriction):', err);
        }
      }

      // Si el navegador bloquea la lectura automática en iframes:
      showStatus('👉 En esta ventana, presione Ctrl + V en su teclado para pegar la captura.', false);
      pasteZone.focus();
    });

    pasteZone.addEventListener('click', function() {
      pasteZone.focus();
    });

    // 3. Handshake inicial de Streamlit
    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function() {
      updateHeight();
    });

    Streamlit.setComponentReady();
    updateHeight();
  </script>
</body>
</html>
