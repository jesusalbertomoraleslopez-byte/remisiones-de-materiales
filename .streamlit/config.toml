[theme]
primaryColor = "#EC2024"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#111111"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true
fileWatcherType = "none"
runOnSave = false
maxUploadSize = 1024
maxMessageSize = 1024
